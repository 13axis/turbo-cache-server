# Publishes a release: run by hand from main with a SemVer (no "v").
#
# It builds the binaries once, then from that one build:
# - commits them, with the version, on a release commit off main and tags it
#   v<version>: the GitHub Action runs the binaries in action/, so users pin
#   that tag (or its commit), and main itself stays free of binaries;
# - pushes the multi-arch image (linux/amd64, linux/arm64) as
#   ghcr.io/<owner>/turbo-cache-server:<version>, :<major>.<minor> and :latest
#   (the last two not for a pre-release such as 5.1.0-rc.1), with BuildKit's
#   provenance and a GitHub build provenance attestation;
# - attaches a CycloneDX SBOM per platform (Syft) to the image digest as an
#   OCI 1.1 referrer (ORAS); `oras discover` lists them;
# - creates the GitHub release with the binaries, their SHA256SUMS, the SBOMs
#   and provenance attestations for the binaries.
#
# Why a manual run creates the tag rather than a pushed tag starting the run:
# the Action needs the binaries in the tagged commit, and a tag pushed by hand
# points at a commit without them.
name: Release
on:
  workflow_dispatch:
    inputs:
      semver:
        description: "The SemVer of this release, without a v (e.g. 5.1.0)"
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sanity-check:
    name: Branch sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.semver }}
        run: python3 .github/scripts/set-version.py "$RELEASE_VERSION"
      - name: Verify main branch and a new tag
        env:
          RELEASE_VERSION: ${{ inputs.semver }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Releases run from the main branch only" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "Tag v$RELEASE_VERSION exists already" >&2
            exit 1
          fi

  build:
    needs: [sanity-check]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ inputs.semver }}

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.semver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Image name and tags
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          tags="$image:$VERSION"
          # A pre-release (5.1.0-rc.1) gets its own tag only.
          if [[ "$VERSION" != *-* ]]; then
            minor="${VERSION%.*}"
            tags="$tags"$'\n'"$image:$minor"$'\n'"$image:latest"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Stage release version
        run: python3 .github/scripts/set-version.py "$VERSION"

      - name: Download all binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: action
          pattern: "*-binaries"
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x action/decay-arm64 action/decay-x64 action/decay-darwin-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Linux image context
        run: |
          mkdir -p release-image/linux/{amd64,arm64}
          cp action/decay-x64 release-image/linux/amd64/decay
          cp action/decay-arm64 release-image/linux/arm64/decay

      - name: Package and push the image (no compilation)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release-image
          file: Dockerfile.release
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # One SBOM per platform, read back from the pushed image by Syft and
      # attached to the image digest as an OCI 1.1 referrer by ORAS (GHCR has
      # no referrers API: ORAS keeps the index in the fallback tag
      # sha256-<digest>, which `oras discover` reads). The binaries are built
      # with cargo-auditable, so the SBOM lists the crates they contain. Both
      # tools are pinned and checked against their release checksums.
      - name: SBOM
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SYFT_VERSION: 1.54.1
          SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
          ORAS_VERSION: 1.3.4
          ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest: '$DIGEST'" >&2; exit 1; }
          bin="$RUNNER_TEMP/sbom-tools"
          mkdir -p "$bin" sbom
          curl -fsSL -o "$bin/syft.tgz" "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$bin/oras.tgz" "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SYFT_SHA256" "$bin/syft.tgz" "$ORAS_SHA256" "$bin/oras.tgz" | sha256sum -c --quiet
          tar -xzf "$bin/syft.tgz" -C "$bin" syft
          tar -xzf "$bin/oras.tgz" -C "$bin" oras
          ref="$IMAGE@$DIGEST"
          for arch in amd64 arm64; do
            file="sbom/turbo-cache-server-$VERSION-linux-$arch.cdx.json"
            SYFT_CHECK_FOR_APP_UPDATE=false \
            SYFT_REGISTRY_AUTH_AUTHORITY=ghcr.io \
            SYFT_REGISTRY_AUTH_USERNAME="$ACTOR" \
            SYFT_REGISTRY_AUTH_PASSWORD="$TOKEN" \
              "$bin/syft" scan "registry:$ref" --platform "linux/$arch" --quiet \
                --select-catalogers +sbom-cataloger -o "cyclonedx-json=$file"
            components=$(jq '.components | length' "$file")
            # The binary's embedded dependency list, not just the base files.
            jq -e 'any(.components[]; .name == "actix-web")' "$file" >/dev/null \
              || { echo "$file lists no Rust crates ($components components)" >&2; exit 1; }
            printf '%s' "$TOKEN" | "$bin/oras" attach --no-tty \
              -u "$ACTOR" --password-stdin \
              --artifact-type application/vnd.cyclonedx+json \
              --annotation "org.opencontainers.image.platform=linux/$arch" \
              --format go-template --template '{{.digest}}' \
              "$ref" "$file:application/vnd.cyclonedx+json" > "sbom/$arch.digest"
            echo "SBOM linux/$arch: CycloneDX, $components components, attached as \`$(cat "sbom/$arch.digest")\`" >> "$GITHUB_STEP_SUMMARY"
          done
          # Read back: the digest lists both among its referrers.
          printf '%s' "$TOKEN" | "$bin/oras" discover --no-tty -u "$ACTOR" --password-stdin \
            --artifact-type application/vnd.cyclonedx+json --format json "$ref" > referrers.json
          for arch in amd64 arm64; do
            jq -e --arg d "$(cat "sbom/$arch.digest")" 'any(.referrers[]; .digest == $d)' referrers.json >/dev/null \
              || { echo "SBOM for linux/$arch not among the referrers of $ref" >&2; cat referrers.json >&2; exit 1; }
          done
          rm sbom/*.digest
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ref\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the binaries and tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add action/decay-arm64 action/decay-x64 action/decay-darwin-arm64 Cargo.toml Cargo.lock
          git commit -m "Release v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Stage release binaries
        run: |
          mkdir -p release-assets
          cp action/decay-x64 release-assets/decay-x86_64-unknown-linux-musl
          cp action/decay-arm64 release-assets/decay-aarch64-unknown-linux-musl
          cp action/decay-darwin-arm64 release-assets/decay-aarch64-apple-darwin
          chmod +x release-assets/*
          cp sbom/*.cdx.json release-assets/
          cd release-assets && sha256sum decay-* ./*.cdx.json > SHA256SUMS

      - name: Attest the binaries' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-assets/decay-*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes=$(mktemp)
          # The CHANGELOG entry for this version, when there is one.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?" v "\\]?([^0-9.-]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$notes"
          {
            echo
            echo "## Image"
            echo
            echo "\`$IMAGE:$VERSION\` (linux/amd64, linux/arm64)"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "The SBOMs (CycloneDX) are attached to the image digest; list them with"
            echo "\`oras discover $IMAGE@$DIGEST\`. Verify the provenance with"
            echo "\`gh attestation verify oci://$IMAGE@$DIGEST -R $REPOSITORY\`."
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Architecture | Asset |"
            echo "| --- | --- | --- |"
            url="https://github.com/$REPOSITORY/releases/download/$tag"
            echo "| Linux (musl, static) | x86-64 | [decay-x86_64-unknown-linux-musl]($url/decay-x86_64-unknown-linux-musl) |"
            echo "| Linux (musl, static) | ARM64 | [decay-aarch64-unknown-linux-musl]($url/decay-aarch64-unknown-linux-musl) |"
            echo "| macOS | Apple Silicon (ARM64) | [decay-aarch64-apple-darwin]($url/decay-aarch64-apple-darwin) |"
            echo
            echo "Verify a download against \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS --ignore-missing\`)"
            echo "or its provenance with \`gh attestation verify <file> -R $REPOSITORY\`."
          } >> "$notes"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes" "${prerelease[@]}" \
            release-assets/*
